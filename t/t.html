<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mendoza Transit · En vivo</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      onerror="this.onerror=null;this.href='https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css'">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
:root{
  --primary:#2e7d32; --tram:#d32f2f; --bus:#e65100; --blue:#1976d2; --amber:#f59e0b;
  --text:#1f2933; --muted:#64748b; --bg:#f8fafc; --surface:#fff;
  --border:#e2e8f0; --hover:#f1f5f9;
}
[data-theme="dark"]{
  --text:#e2e8f0; --muted:#94a3b8; --bg:#0f172a; --surface:#1e293b;
  --border:#334155; --hover:#334155;
}
*{ box-sizing:border-box; }
html,body{ height:100%; margin:0; }
body{
  font-family:system-ui,'Segoe UI',sans-serif;
  color:var(--text); background:var(--bg);
  overflow:hidden;
  transition:background .25s,color .25s;
}
#map{ position:absolute; inset:0; z-index:1; background:var(--bg); }

/* ---------- Topbar ---------- */
.topbar{
  position:absolute; top:0; left:0; right:0;
  padding:calc(10px + env(safe-area-inset-top)) 12px 10px;
  display:flex; align-items:center; gap:8px;
  background:var(--surface);
  border-bottom:1px solid var(--border);
  z-index:1100;
}
.topbar h1{
  margin:0; font-size:1rem; flex:1; min-width:0;
  display:flex; align-items:center; gap:8px;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
}
.topbar h1 i{ color:var(--primary); }
.icon-btn{
  width:38px; height:38px; display:grid; place-items:center;
  border:0; border-radius:10px; background:var(--hover); color:var(--text);
  font-size:1rem; cursor:pointer; flex:0 0 auto;
  transition:background .2s,transform .15s;
}
.icon-btn:hover{ background:var(--border); }
.icon-btn:active{ transform:scale(.92); }
.icon-btn.is-loading i{ animation:spin 1s linear infinite; }
@keyframes spin{ to{ transform:rotate(360deg); } }
@keyframes pulse{
  0%,100%{ transform:scale(1); opacity:1; }
  50%{ transform:scale(1.4); opacity:.55; }
}

/* ---------- Filtros ---------- */
.filterbar{
  position:absolute; top:calc(64px + env(safe-area-inset-top));
  left:12px; right:12px; display:flex; gap:8px; z-index:1050;
  overflow-x:auto; padding-bottom:2px;
  -webkit-overflow-scrolling:touch;
}
.filterbar::-webkit-scrollbar{ display:none; }
.chip{
  display:flex; align-items:center; gap:6px;
  padding:7px 11px; background:var(--surface);
  border:1.5px solid var(--border); border-radius:10px;
  color:var(--muted); font-size:.8rem; font-weight:600;
  cursor:pointer; user-select:none; flex:0 0 auto;
  box-shadow:0 2px 6px rgba(0,0,0,.1);
  transition:all .2s;
}
.chip input{ display:none; }
.chip__count{
  padding:1px 6px; border-radius:8px;
  background:rgba(0,0,0,.1); font-size:.7rem;
  font-variant-numeric:tabular-nums;
}
.chip--bike.is-on{ border-color:var(--primary); background:#e8f5e9; color:var(--primary); }
.chip--tram.is-on{ border-color:var(--tram); background:#ffebee; color:var(--tram); }
.chip--bus.is-on { border-color:var(--bus);  background:#fff3e0; color:var(--bus); }
[data-theme="dark"] .chip--bike.is-on{ background:#1b3a1e; color:#a5d6a7; }
[data-theme="dark"] .chip--tram.is-on{ background:#4a1c1c; color:#ef9a9a; }
[data-theme="dark"] .chip--bus.is-on { background:#3e1f00; color:#ffb74d; }

/* ---------- Statusbar ---------- */
.statusbar{
  position:absolute; bottom:calc(20px + env(safe-area-inset-bottom));
  left:12px; right:80px;
  padding:8px 12px; border-radius:10px;
  background:var(--surface); border:1px solid var(--border);
  font-size:.78rem; font-weight:600; color:var(--muted);
  box-shadow:0 2px 8px rgba(0,0,0,.1);
  z-index:1000;
  display:flex; align-items:center; gap:8px;
}
.statusbar.ok{ color:#1b5e20; background:#e8f5e9; border-color:#a5d6a7; }
.statusbar.warn{ color:#92400e; background:#fff8e1; border-color:#fcd34d; }
.statusbar.err{ color:#991b1b; background:#ffebee; border-color:#ef9a9a; }
[data-theme="dark"] .statusbar{ background:#1e293b; }
[data-theme="dark"] .statusbar.ok{ background:#1b3a1e; }
[data-theme="dark"] .statusbar.warn{ background:#3a2e0d; color:#fcd34d; }
[data-theme="dark"] .statusbar.err{ background:#3a1a1a; color:#ef9a9a; }

/* ---------- FAB ubicación ---------- */
.fab{
  position:absolute; right:16px;
  bottom:calc(20px + env(safe-area-inset-bottom));
  width:50px; height:50px; display:grid; place-items:center;
  border:0; border-radius:50%; background:var(--surface); color:var(--blue);
  font-size:1.1rem; box-shadow:0 4px 12px rgba(0,0,0,.2);
  cursor:pointer; z-index:1000;
  transition:transform .18s,background .2s;
}
.fab:hover{ background:var(--hover); }
.fab:active{ transform:scale(.9); }
.fab.is-locating i{ animation:spin 1s linear infinite; }

/* ---------- Pines ---------- */
.pin{
  width:30px; height:30px; display:grid; place-items:center;
  border:2.5px solid #fff; border-radius:50%;
  color:#fff; font-size:.85rem;
  box-shadow:0 3px 8px rgba(0,0,0,.3);
}
.pin--bike{ background:var(--primary); }
.pin--tram{ background:var(--tram); }
.pin--bus { background:var(--bus); }

/* ---------- Popups ---------- */
.leaflet-popup-content-wrapper{
  border-radius:12px; padding:0; overflow:hidden;
  background:var(--surface); color:var(--text);
}
.leaflet-popup-content{ margin:0; }
.leaflet-popup-tip{ background:var(--surface); }
.popup-head{
  padding:10px 12px; color:#fff; font-size:.85rem; font-weight:700;
  display:flex; align-items:center; gap:8px;
}
.popup-head--bike{ background:var(--primary); }
.popup-head--tram{ background:var(--tram); }
.popup-head--bus { background:var(--bus); }
.popup-body{ padding:8px 12px; font-size:.78rem; }
.popup-body .row{ display:flex; justify-content:space-between; gap:10px; padding:2px 0; }
.popup-body .k{ color:var(--muted); }
.popup-body .v{ font-weight:600; text-align:right; }
.popup-actions{ display:flex; gap:6px; padding:0 12px 12px; }
.popup-actions a{
  flex:1; padding:7px; border-radius:8px;
  background:var(--hover); color:var(--text);
  font-size:.74rem; font-weight:600; text-align:center;
  text-decoration:none; transition:background .2s;
}
.popup-actions a:hover{ background:var(--border); }

/* ---------- Error fatal ---------- */
#fatal-error{
  position:fixed; inset:0; z-index:9999;
  background:#fee2e2; color:#991b1b;
  padding:24px; font-family:monospace; font-size:.85rem;
  overflow:auto; display:none; white-space:pre-wrap;
}
[data-theme="dark"] #fatal-error{ background:#3a1a1a; color:#fecaca; }
</style>
</head>
<body>

<header class="topbar">
  <h1><i class="fa-solid fa-map-location-dot"></i> Mendoza Transit · En vivo</h1>
  <button class="icon-btn" id="theme-btn" title="Modo oscuro"><i class="fa-solid fa-moon"></i></button>
  <button class="icon-btn" id="refresh-btn" title="Recargar"><i class="fa-solid fa-rotate"></i></button>
</header>

<div class="filterbar">
  <label class="chip chip--bike is-on">
    <input type="checkbox" data-type="bike" checked>
    <i class="fa-solid fa-bicycle"></i> Bicis
    <span class="chip__count" id="count-bike">0</span>
  </label>
  <label class="chip chip--tram is-on">
    <input type="checkbox" data-type="tram" checked>
    <i class="fa-solid fa-train-tram"></i> Tranvías
    <span class="chip__count" id="count-tram">0</span>
  </label>
  <label class="chip chip--bus is-on">
    <input type="checkbox" data-type="bus" checked>
    <i class="fa-solid fa-bus"></i> Buses EN VIVO
    <span class="chip__count" id="count-bus">0</span>
  </label>
</div>

<div class="statusbar" id="statusbar">
  <i class="fa-solid fa-circle-notch fa-spin"></i>
  <span id="status-text">Iniciando…</span>
</div>

<button class="fab" id="locate-btn" title="Mi ubicación">
  <i class="fa-solid fa-location-crosshairs"></i>
</button>

<div id="map"></div>
<div id="fatal-error"></div>

<script>
window.__leafletLoaded = false;
</script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        onload="window.__leafletLoaded=true"
        onerror="loadLeafletFallback()"></script>
<script>
function loadLeafletFallback(){
  var s = document.createElement('script');
  s.src = 'https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js';
  s.onload = function(){ window.__leafletLoaded = true; boot(); };
  s.onerror = function(){ showFatal('No se pudo cargar Leaflet desde ninguna CDN.'); };
  document.head.appendChild(s);
}
function showFatal(msg){
  var el = document.getElementById('fatal-error');
  el.style.display = 'block';
  el.textContent = '⚠️ Error crítico:\n\n' + msg;
}
window.addEventListener('error', function(e){
  console.error('Error global:', e.error || e.message);
});
</script>

<script>
function boot(){
  if (typeof L === 'undefined') { showFatal('Leaflet no está disponible.'); return; }

  /* ============================================================
     ALMACÉN SEGURO
     ============================================================ */
  var store = (function(){
    var mem = {};
    var ok = false;
    try {
      window.localStorage.setItem('__t','1');
      window.localStorage.removeItem('__t');
      ok = true;
    } catch(e) { ok = false; }
    return {
      get: function(k, fb){
        try { return ok ? (window.localStorage.getItem(k) || fb) : (mem[k] || fb); }
        catch(e){ return mem[k] || fb; }
      },
      set: function(k, v){
        try { ok ? window.localStorage.setItem(k, v) : (mem[k] = v); }
        catch(e){ mem[k] = v; }
      }
    };
  })();

  /* ============================================================
     CONFIGURACIÓN
     ============================================================ */
  var CFG = {
    center: [-32.930, -68.820],
    zoom: 12,
    bbox: '-33.05,-68.95,-32.80,-68.70',
    timeoutMs: 12000,
    cacheKey: 'mendoza:v2',
    cacheTtl: 15 * 60 * 1000,
    themeKey: 'mendoza-theme:v2',
    endpoints: [
      'https://overpass-api.de/api/interpreter',
      'https://overpass.kumi.systems/api/interpreter',
      'https://overpass.private.coffee/api/interpreter'
    ]
  };

  /* ============================================================
     DATOS SEMILLA (bicis y tranvías)
     ============================================================ */
  var SEED = [
    { id:'s/b1', type:'bike', lat:-32.8895, lon:-68.8458, name:'BiciMendoza - Parque Central',
      tags:{ operator:'BiciMendoza', capacity:'24' } },

      tags:{ operator:'BiciMendoza', capacity:'16' } },
    { id:'s/b3', type:'bike', lat:-32.8935, lon:-68.8555, name:'BiciMendoza - Parque San Martín',
      tags:{ operator:'BiciMendoza', capacity:'20' } },
    { id:'s/b4', type:'bike', lat:-32.8830, lon:-68.8360, name:'BiciMendoza - Ciudad Universitaria',
      tags:{ operator:'BiciMendoza', capacity:'18' } },
    { id:'s/b5', type:'bike', lat:-32.8985, lon:-68.8290, name:'BiciMendoza - Terminal de Ómnibus',
      tags:{ operator:'BiciMendoza', capacity:'22' } },

    { id:'s/t1', type:'tram', lat:-32.8905, lon:-68.8540, name:'Metrotranvía - Estación Central',
      tags:{ operator:'Metrotranvía Mendoza' } },
    { id:'s/t2', type:'tram', lat:-32.8872, lon:-68.8470, name:'Metrotranvía - Pedro Molina',
      tags:{ operator:'Metrotranvía Mendoza' } },
    { id:'s/t3', type:'tram', lat:-32.8850, lon:-68.8390, name:'Metrotranvía - 9 de Julio',
      tags:{ operator:'Metrotranvía Mendoza' } },
    { id:'s/t4', type:'tram', lat:-32.8830, lon:-68.8310, name:'Metrotranvía - Pellegrini',
      tags:{ operator:'Metrotranvía Mendoza' } },
    { id:'s/t5', type:'tram', lat:-32.8805, lon:-68.8220, name:'Metrotranvía - San Martín',
      tags:{ operator:'Metrotranvía Mendoza' } },
    { id:'s/t6', type:'tram', lat:-32.9050, lon:-68.8010, name:'Metrotranvía - Godoy Cruz',
      tags:{ operator:'Metrotranvía Mendoza' } },
    { id:'s/t7', type:'tram', lat:-32.9180, lon:-68.7890, name:'Metrotranvía - Luzuriaga',
      tags:{ operator:'Metrotranvía Mendoza' } },
    { id:'s/t8', type:'tram', lat:-32.9310, lon:-68.7770, name:'Metrotranvía - Maipú',
      tags:{ operator:'Metrotranvía Mendoza' } }
  ];

  /* ============================================================
     RUTAS DE BUSES — 10 líneas, múltiples unidades por línea
     ============================================================ */
  var BUS_ROUTES = [
    { id:'bus/110', line:'110', name:'Línea 110 · Centro ↔ Luzuriaga',
      color:'#e65100', speed:28, buses:3,
      stops:[[-32.8890,-68.8440],[-32.8915,-68.8375],[-32.8940,-68.8330],
             [-32.8975,-68.8280],[-32.9010,-68.8150],[-32.9040,-68.7990],
             [-32.9090,-68.7940],[-32.9160,-68.7880]] },

    { id:'bus/200', line:'200', name:'Línea 200 · Centro ↔ Las Heras',
      color:'#e65100', speed:32, buses:3,
      stops:[[-32.8890,-68.8440],[-32.8855,-68.8405],[-32.8830,-68.8360],
             [-32.8790,-68.8410],[-32.8730,-68.8480],[-32.8700,-68.8540],
             [-32.8740,-68.8580],[-32.8780,-68.8620]] },

    { id:'bus/130', line:'130', name:'Línea 130 · Parque ↔ Godoy Cruz',
      color:'#e65100', speed:25, buses:2,
      stops:[[-32.8860,-68.8520],[-32.8875,-68.8480],[-32.8890,-68.8440],
             [-32.8930,-68.8380],[-32.8975,-68.8280],[-32.9010,-68.8130],
             [-32.9040,-68.7990]] },

    { id:'bus/810', line:'810', name:'Línea 810 · Centro ↔ Rodeo del Medio',
      color:'#e65100', speed:35, buses:3,
      stops:[[-32.8890,-68.8440],[-32.8950,-68.8220],[-32.9040,-68.7990],
             [-32.9160,-68.7880],[-32.9280,-68.7780],[-32.9450,-68.7650],
             [-32.9580,-68.7540],[-32.9680,-68.7480]] },

    { id:'bus/350', line:'350', name:'Línea 350 · Parque ↔ Las Heras',
      color:'#e65100', speed:30, buses:2,
      stops:[[-32.8860,-68.8520],[-32.8800,-68.8500],[-32.8730,-68.8480],
             [-32.8700,-68.8540],[-32.8740,-68.8580],[-32.8780,-68.8620],
             [-32.8830,-68.8580],[-32.8905,-68.8540]] },

    { id:'bus/111', line:'111', name:'Línea 111 · Centro ↔ Guaymallén',
      color:'#e65100', speed:26, buses:2,
      stops:[[-32.8890,-68.8440],[-32.8895,-68.8380],[-32.8900,-68.8320],
             [-32.8920,-68.8260],[-32.8950,-68.8180],[-32.8970,-68.8120]] },

    { id:'bus/120', line:'120', name:'Línea 120 · Centro ↔ Maipú',
      color:'#e65100', speed:33, buses:3,
      stops:[[-32.8890,-68.8440],[-32.8930,-68.8350],[-32.8990,-68.8210],
             [-32.9060,-68.8090],[-32.9150,-68.7970],[-32.9230,-68.7870],
             [-32.9280,-68.7780]] },

    { id:'bus/100', line:'100', name:'Línea 100 · Centro ↔ Las Heras Express',
      color:'#e65100', speed:38, buses:2,
      stops:[[-32.8890,-68.8440],[-32.8840,-68.8420],[-32.8800,-68.8460],
             [-32.8770,-68.8520],[-32.8750,-68.8580],[-32.8780,-68.8620]] },

    { id:'bus/205', line:'205', name:'Línea 205 · Terminal ↔ Luzuriaga',
      color:'#e65100', speed:28, buses:2,
      stops:[[-32.8975,-68.8280],[-32.9010,-68.8130],[-32.9040,-68.7990],
             [-32.9090,-68.7940],[-32.9160,-68.7880],[-32.9210,-68.7830]] },

    { id:'bus/221', line:'221', name:'Línea 221 · Ciudad Univ. ↔ Centro',
      color:'#e65100', speed:24, buses:2,
      stops:[[-32.8830,-68.8360],[-32.8845,-68.8400],[-32.8870,-68.8420],
             [-32.8890,-68.8440],[-32.8920,-68.8470],[-32.8950,-68.8500]] }
  ];

  /* ============================================================
     ESTADO
     ============================================================ */
  var state = {
    items: [],
    filters: { bike: true, tram: true, bus: true },
    userLatLng: null,
    userMarker: null,
    userAccuracy: null,
    theme: store.get(CFG.themeKey, 'light'),
    loading: false
  };

  var $ = function(id){ return document.getElementById(id); };
  var statusBar = $('statusbar');
  var refreshBtn = $('refresh-btn');
  var themeBtn = $('theme-btn');
  var locateBtn = $('locate-btn');
  var countEls = { bike: $('count-bike'), tram: $('count-tram'), bus: $('count-bus') };

  var ESC = { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' };
  function esc(v){ return String(v == null ? '' : v).replace(/[&<>"']/g, function(c){ return ESC[c]; }); }

  function setStatus(kind, msg){
    statusBar.className = 'statusbar' + (kind ? ' ' + kind : '');
    var icons = { ok:'fa-circle-check', warn:'fa-triangle-exclamation', err:'fa-circle-exclamation' };
    var icon = icons[kind] || 'fa-circle-notch fa-spin';
    statusBar.innerHTML = '<i class="fa-solid ' + icon + '"></i><span>' + esc(msg) + '</span>';
  }

  /* ============================================================
     MAPA
     ============================================================ */
  var map;
  try {
    map = L.map('map', { zoomControl: false, preferCanvas: true })
             .setView(CFG.center, CFG.zoom);
    L.control.zoom({ position: 'bottomleft' }).addTo(map);
  } catch(e) {
    showFatal('No se pudo inicializar el mapa:\n\n' + e.message);
    return;
  }

  var tileLayer = null;

  function applyTiles(){
    try {
      if (tileLayer) map.removeLayer(tileLayer);
      var url = state.theme === 'dark'
        ? 'https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png'
        : 'https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png';
      tileLayer = L.tileLayer(url, {
        maxZoom: 19,
        attribution: '&copy; OpenStreetMap &copy; CARTO'
      }).addTo(map);
      if (tileLayer.bringToBack) tileLayer.bringToBack();
    } catch(e) { console.warn('Error tiles:', e.message); }
  }

  function applyTheme(){
    document.documentElement.setAttribute('data-theme', state.theme);
    themeBtn.querySelector('i').className = state.theme === 'dark'
      ? 'fa-solid fa-sun' : 'fa-solid fa-moon';
    applyTiles();
  }

  themeBtn.addEventListener('click', function(){
    state.theme = state.theme === 'dark' ? 'light' : 'dark';
    store.set(CFG.themeKey, state.theme);
    applyTheme();
  });

  /* ============================================================
     ICONOS Y CAPAS
     ============================================================ */
  var ICON_MAP = { bike:'fa-bicycle', tram:'fa-train-tram', bus:'fa-bus' };

  function pinIcon(type){
    return L.divIcon({
      html: '<div class="pin pin--' + type + '">' +
              '<i class="fa-solid ' + ICON_MAP[type] + '"></i></div>',
      className:'', iconSize:[30,30], iconAnchor:[15,15], popupAnchor:[0,-16]
    });
  }

  var layers = {
    bike: L.layerGroup(),
    tram: L.layerGroup(),
    bus:  L.layerGroup()
  };

  /* ============================================================
     POPUPS DE BICI/TRANVÍA
     ============================================================ */
  function popupHtml(item){
    var t = item.tags || {};
    var type = item.type;
    var rows = [];

    var addr = [t['addr:street'], t['addr:housenumber']].filter(Boolean).join(' ').trim();
    if (addr) rows.push(['Dirección', esc(addr)]);
    if (t.operator) rows.push(['Operador', esc(t.operator)]);
    if (t.network) rows.push(['Red', esc(t.network)]);
    if (type === 'bike' && t.capacity) rows.push(['Capacidad', esc(t.capacity) + ' bicis']);
    if (type === 'tram' && t.capacity) rows.push(['Capacidad', esc(t.capacity) + ' andenes']);
    if (t.opening_hours) rows.push(['Horario', esc(t.opening_hours)]);
    if (state.userLatLng) {
      var d = map.distance([item.lat, item.lon], state.userLatLng);
      rows.push(['A tu ubicación', d < 1000 ? Math.round(d) + ' m' : (d/1000).toFixed(1) + ' km']);
    }

    var body = rows.map(function(r){
      return '<div class="row"><span class="k">' + r[0] + '</span><span class="v">' + r[1] + '</span></div>';
    }).join('');

    var dirUrl = 'https://www.google.com/maps/dir/?api=1&destination=' + item.lat + ',' + item.lon;

    return '<div class="popup">' +
      '<div class="popup-head popup-head--' + type + '">' +
        '<i class="fa-solid ' + ICON_MAP[type] + '"></i>' +
        '<span>' + esc(item.name) + '</span>' +
      '</div>' +
      '<div class="popup-body">' + body + '</div>' +
      '<div class="popup-actions">' +
        '<a href="' + dirUrl + '" target="_blank" rel="noopener">' +
          '<i class="fa-solid fa-diamond-turn-right"></i> Cómo llegar' +
        '</a>' +
      '</div>' +
    '</div>';
  }

  /* ============================================================
     RENDER (bicis / tranvías)
     ============================================================ */
  function render(items){
    state.items = items;
    try {
      layers.bike.clearLayers();
      layers.tram.clearLayers();

      var counts = { bike:0, tram:0 };

      items.forEach(function(item){
        var marker = L.marker([item.lat, item.lon], {
          icon: pinIcon(item.type),
          title: item.name
        });
        marker.bindPopup(function(){ return popupHtml(item); }, { maxWidth:300 });
        layers[item.type].addLayer(marker);
        counts[item.type]++;
      });

      countEls.bike.textContent = counts.bike;
      countEls.tram.textContent = counts.tram;
      applyFilters();
    } catch(e) {
      console.error('Error en render:', e);
      setStatus('err', 'Error dibujando marcadores: ' + e.message);
    }
  }

  /* ============================================================
     SIMULACIÓN DE BUSES EN VIVO
     ============================================================ */
  var liveBuses = {};
  var busAnimationTimer = null;

  function speedFactorForHour(h){
    if ((h >= 6 && h < 9) || (h >= 17 && h < 20)) return 0.55; // pico
    if (h >= 22 || h < 6) return 1.2;                          // nocturno
    return 1.0;
  }

  function createBusIcon(color, bearing){
    return L.divIcon({
      html:
        '<div style="width:36px;height:36px;display:grid;place-items:center;' +
          'background:' + color + ';border:3px solid #fff;border-radius:10px;' +
          'box-shadow:0 4px 12px rgba(0,0,0,.45);color:#fff;font-size:15px;' +
          'transform:rotate(' + bearing + 'deg);transition:transform .3s ease;">' +
          '<i class="fa-solid fa-bus"></i>' +
        '</div>' +
        '<div style="position:absolute;top:-4px;right:-4px;width:12px;height:12px;' +
          'background:#4caf50;border:2px solid #fff;border-radius:50%;' +
          'box-shadow:0 0 6px rgba(76,175,80,.9);animation:pulse 1.5s infinite;">' +
        '</div>',
      className:'',
      iconSize:[36,36],
      iconAnchor:[18,18],
      popupAnchor:[0,-20]
    });
  }

  function lerp(a, b, t){
    return [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t];
  }

  function distM(a, b){
    var R = 6371000;
    var dLat = (b[0] - a[0]) * Math.PI / 180;
    var dLon = (b[1] - a[1]) * Math.PI / 180;
    var x = Math.sin(dLat/2) * Math.sin(dLat/2) +
            Math.cos(a[0]*Math.PI/180) * Math.cos(b[0]*Math.PI/180) *
            Math.sin(dLon/2) * Math.sin(dLon/2);
    return R * 2 * Math.atan2(Math.sqrt(x), Math.sqrt(1-x));
  }

  function bearingDeg(a, b){
    var dLon = (b[1] - a[1]) * Math.PI / 180;
    var lat1 = a[0] * Math.PI / 180;
    var lat2 = b[0] * Math.PI / 180;
    var y = Math.sin(dLon) * Math.cos(lat2);
    var x = Math.cos(lat1) * Math.sin(lat2) -
            Math.sin(lat1) * Math.cos(lat2) * Math.cos(dLon);
    return (Math.atan2(y, x) * 180 / Math.PI + 360) % 360;
  }

  function initBus(route, busIndex){
    var stops = route.stops;
    var totalBuses = route.buses || 1;

    // Distribuir a lo largo del recorrido
    var initialProgress = busIndex / totalBuses;
    var totalSegments = stops.length - 1;
    var startSegFloat = initialProgress * totalSegments;
    var startSeg = Math.floor(startSegFloat) % totalSegments;
    var startT = startSegFloat - Math.floor(startSegFloat);

    var startPos = lerp(stops[startSeg], stops[startSeg + 1], startT);
    var bearing = bearingDeg(stops[startSeg], stops[startSeg + 1]);

    var marker = L.marker(startPos, {
      icon: createBusIcon(route.color, bearing),
      title: route.name + ' · EN VIVO',
      zIndexOffset: 1000
    });

    var busKey = route.id + '#' + busIndex;

    marker.bindPopup(function(){
      var b = liveBuses[busKey];
      if (!b) return '<b>' + esc(route.name) + '</b>';

      var h = new Date().getHours();
      var factor = speedFactorForHour(h);
      var effectiveSpeed = Math.round(route.speed * factor);
      var franja =
        factor < 0.8 ? '🚦 Hora pico' :
        factor > 1.1 ? '🌙 Nocturno'  :
                       '☀️ Normal';

      var ll = marker.getLatLng();
      var nextStop = stops[b.nextIndex];
      var distNext = Math.round(distM([ll.lat, ll.lng], nextStop));

      return '<div class="popup">' +
        '<div class="popup-head popup-head--bus">' +
          '<i class="fa-solid fa-bus"></i>' +
          '<span>' + esc(route.name) + '</span>' +
        '</div>' +
        '<div class="popup-body">' +
          '<div class="row"><span class="k">Línea</span><span class="v">' + route.line + '</span></div>' +
          '<div class="row"><span class="k">Unidad</span><span class="v">#' + (busIndex + 1) + '</span></div>' +
          '<div class="row"><span class="k">Velocidad</span><span class="v">~' + effectiveSpeed + ' km/h</span></div>' +
          '<div class="row"><span class="k">Franja</span><span class="v">' + franja + '</span></div>' +
          '<div class="row"><span class="k">Estado</span><span class="v" style="color:#4caf50">● Circulando</span></div>' +
          '<div class="row"><span class="k">Próxima parada</span><span class="v">' + distNext + ' m</span></div>' +
          '<div class="row"><span class="k">Sentido</span><span class="v">' +
            (b.direction > 0 ? 'Ida →' : '← Vuelta') + '</span></div>' +
        '</div>' +
      '</div>';
    }, { maxWidth: 280 });

    liveBuses[busKey] = {
      marker: marker,
      route: route,
      busIndex: busIndex,
      stopIndex: startSeg,
      nextIndex: startSeg + 1,
      t: startT,
      direction: 1,
      stopped: false,
      stopTimer: 0
    };

    layers.bus.addLayer(marker);
  }

  function tickBuses(){
    var now = Date.now();
    var hour = new Date().getHours();
    var factor = speedFactorForHour(hour);

    Object.keys(liveBuses).forEach(function(key){
      var b = liveBuses[key];
      if (!b || !b.marker) return;

      var stops = b.route.stops;

      // Pausa en parada
      if (b.stopped) {
        if (now - b.stopTimer > 2500 + Math.random() * 2500) b.stopped = false;
        else return;
      }

      var from = stops[b.stopIndex];
      var to   = stops[b.nextIndex];
      if (!from || !to) return;

      var segDist = distM(from, to);
      var speedMs = (b.route.speed * factor * 1000) / 3600;
      var dt = 1.2;
      var advance = (speedMs * dt) / Math.max(segDist, 1);

      b.t += advance;

      if (b.t >= 1) {
        b.t = 0;
        b.stopIndex = b.nextIndex;
        b.stopped = true;
        b.stopTimer = now;

        var next = b.stopIndex + b.direction;
        if (next >= stops.length || next < 0) {
          b.direction *= -1;
          next = b.stopIndex + b.direction;
        }
        b.nextIndex = next;
      }

      var pos = lerp(stops[b.stopIndex], stops[b.nextIndex], b.t);
      b.marker.setLatLng(pos);

      // Rotar icono
      var bearing = bearingDeg(stops[b.stopIndex], stops[b.nextIndex]);
      if (b.direction < 0) bearing = (bearing + 180) % 360;

      var el = b.marker.getElement();
      if (el) {
        var inner = el.querySelector('div');
        if (inner) inner.style.transform = 'rotate(' + bearing + 'deg)';
      }
    });
  }

  function startBusSimulation(){
    stopBusSimulation();
    var delay = 0;

    BUS_ROUTES.forEach(function(route){
      var n = route.buses || 1;
      for (var i = 0; i < n; i++) {
        (function(r, idx, d){
          setTimeout(function(){ initBus(r, idx); }, d);
        })(route, i, delay);
        delay += 120;
      }
    });

    // Actualizar contador después de crear todos
    var totalToCreate = BUS_ROUTES.reduce(function(a, r){ return a + (r.buses || 1); }, 0);
    setTimeout(function(){
      countEls.bus.textContent = Object.keys(liveBuses).length;
    }, delay + 300);

    busAnimationTimer = setInterval(tickBuses, 1200);
  }

  function stopBusSimulation(){
    if (busAnimationTimer) clearInterval(busAnimationTimer);
    busAnimationTimer = null;
    Object.keys(liveBuses).forEach(function(key){
      var b = liveBuses[key];
      if (b && b.marker) layers.bus.removeLayer(b.marker);
    });
    liveBuses = {};
    countEls.bus.textContent = 0;
  }

  /* ============================================================
     FILTROS
     ============================================================ */
  function applyFilters(){
    Object.keys(layers).forEach(function(type){
      if (state.filters[type]) {
        if (!map.hasLayer(layers[type])) map.addLayer(layers[type]);
      } else {
        if (map.hasLayer(layers[type])) map.removeLayer(layers[type]);
      }
    });

    // Buses: pausar/reanudar simulación según filtro
    if (!state.filters.bus) {
      stopBusSimulation();
    } else if (Object.keys(liveBuses).length === 0 && busAnimationTimer === null) {
      startBusSimulation();
    }
  }

  /* ============================================================
     OVERPASS API
     ============================================================ */
  function buildQuery(){
    return '[out:json][timeout:25];' +
      '(' +
      'nwr["amenity"="bicycle_rental"](' + CFG.bbox + ');' +
      'nwr["railway"="tram_stop"](' + CFG.bbox + ');' +
      ');' +
      'out center;';
  }

  function tryEndpoint(endpoint, query){
    return new Promise(function(resolve, reject){
      var ctrl = new AbortController();
      var timer = setTimeout(function(){ ctrl.abort(); }, CFG.timeoutMs);

      fetch(endpoint, {
        method:'POST',
        headers:{ 'Content-Type':'application/x-www-form-urlencoded;charset=UTF-8' },
        body: 'data=' + encodeURIComponent(query),
        signal: ctrl.signal
      })
      .then(function(res){
        clearTimeout(timer);
        if (!res.ok) throw new Error('HTTP ' + res.status);
        return res.json();
      })
      .then(function(json){
        if (!json || !Array.isArray(json.elements)) throw new Error('JSON inválido');
        resolve(json.elements);
      })
      .catch(function(err){ clearTimeout(timer); reject(err); });
    });
  }

  function fetchOverpass(query){
    var i = 0;
    function next(){
      if (i >= CFG.endpoints.length) return Promise.reject(new Error('Sin endpoints'));
      var ep = CFG.endpoints[i++];
      return tryEndpoint(ep, query).catch(function(err){
        console.warn('Falló', ep, err.message);
        return next();
      });
    }
    return next();
  }

  function normalize(elements){
    var items = [], seen = {};
    elements.forEach(function(el){
      var lat = typeof el.lat === 'number' ? el.lat : (el.center && el.center.lat);
      var lon = typeof el.lon === 'number' ? el.lon : (el.center && el.center.lon);
      if (typeof lat !== 'number' || typeof lon !== 'number') return;
      var tags = el.tags || {};
      var type = null;
      if (tags.amenity === 'bicycle_rental') type = 'bike';
      else if (tags.railway === 'tram_stop') type = 'tram';
      if (!type) return;

      var id = el.type + '/' + el.id;
      if (seen[id]) return;
      seen[id] = true;

      var defaults = { bike:'Estación de bicicletas', tram:'Parada de tranvía' };
      items.push({
        id:id, type:type, lat:lat, lon:lon, tags:tags,
        name: tags.name || defaults[type]
      });
    });
    return items;
  }

  /* ============================================================
     CARGA
     ============================================================ */
  function readCache(){
    try {
      var raw = store.get(CFG.cacheKey);
      if (!raw) return null;
      var p = JSON.parse(raw);
      if (!p || !Array.isArray(p.items)) return null;
      if (Date.now() - p.ts > CFG.cacheTtl) return null;
      return p;
    } catch(e){ return null; }
  }

  function writeCache(items){
    try { store.set(CFG.cacheKey, JSON.stringify({ ts: Date.now(), items: items })); } catch(e){}
  }

  function loadData(force){
    if (state.loading) return;
    state.loading = true;
    refreshBtn.classList.add('is-loading');
    refreshBtn.disabled = true;

    if (state.items.length === 0) {
      render(SEED);
      startBusSimulation();
      setStatus('', 'Buses EN VIVO · consultando API para bicis/tranvías…');
    }

    if (!force) {
      var cached = readCache();
      if (cached) {
        render(cached.items);
        setStatus('', 'Datos guardados · actualizando…');
      }
    }

    fetchOverpass(buildQuery())
      .then(function(elements){
        var items = normalize(elements);
        if (items.length === 0) {
          setStatus('warn', 'API sin datos nuevos · manteniendo semilla + buses en vivo');
          return;
        }
        render(items);
        writeCache(items);

        var c = { bike:0, tram:0 };
        items.forEach(function(i){ c[i.type] = (c[i.type] || 0) + 1; });
        setStatus('ok', c.bike + ' bicis · ' + c.tram + ' tranvías · ' +
                          Object.keys(liveBuses).length + ' buses EN VIVO');
      })
      .catch(function(err){
        console.warn('API falló:', err.message);
        setStatus('warn', 'API no accesible · semilla + buses EN VIVO activos');
      })
      .then(function(){
        state.loading = false;
        refreshBtn.classList.remove('is-loading');
        refreshBtn.disabled = false;
      });
  }

  /* ============================================================
     GEOLOCALIZACIÓN
     ============================================================ */
  function locateUser(){
    if (!('geolocation' in navigator)) {
      setStatus('err', 'Geolocalización no soportada');
      return;
    }
    locateBtn.classList.add('is-locating');
    map.locate({ setView: true, maxZoom: 16, enableHighAccuracy: true, timeout: 12000 });
  }

  map.on('locationfound', function(e){
    locateBtn.classList.remove('is-locating');
    state.userLatLng = e.latlng;

    if (state.userMarker) {
      state.userMarker.setLatLng(e.latlng);
      state.userAccuracy.setLatLng(e.latlng).setRadius(e.accuracy);
    } else {
      state.userAccuracy = L.circle(e.latlng, {
        radius: e.accuracy, color:'#1976d2', weight:1,
        fillColor:'#1976d2', fillOpacity:.12, interactive:false
      }).addTo(map);
      state.userMarker = L.circleMarker(e.latlng, {
        radius:8, color:'#fff', weight:3,
        fillColor:'#1976d2', fillOpacity:1
      }).addTo(map).bindPopup('<b>Estás aquí</b>');
    }
    state.userMarker.openPopup();
    setStatus('ok', 'Ubicación detectada (±' + Math.round(e.accuracy) + ' m)');
  });

  map.on('locationerror', function(e){
    locateBtn.classList.remove('is-locating');
    setStatus('err', e.message || 'No se pudo obtener ubicación');
  });

  /* ============================================================
     UI
     ============================================================ */
  refreshBtn.addEventListener('click', function(){ loadData(true); });
  locateBtn.addEventListener('click', locateUser);

  var chips = document.querySelectorAll('.chip input[data-type]');
  Array.prototype.forEach.call(chips, function(input){
    input.addEventListener('change', function(){
      var type = input.dataset.type;
      state.filters[type] = input.checked;
      input.closest('.chip').classList.toggle('is-on', input.checked);
      applyFilters();
    });
  });

  /* ============================================================
     ARRANQUE
     ============================================================ */
  try {
    applyTheme();
    loadData(false);
  } catch(e) {
    console.error('Error arrancando:', e);
    showFatal('Error al iniciar:\n\n' + e.message + '\n\n' + (e.stack || ''));
  }
}

/* ---------- Esperar Leaflet y arrancar ---------- */
if (window.__leafletLoaded) {
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', boot);
  } else { boot(); }
} else {
  var attempts = 0;
  var waitLeaflet = setInterval(function(){
    attempts++;
    if (window.__leafletLoaded) { clearInterval(waitLeaflet); boot(); }
    else if (attempts > 50) {
      clearInterval(waitLeaflet);
      showFatal('Timeout esperando Leaflet. Verificá tu conexión.');
    }
  }, 100);
}
</script>
</body>
