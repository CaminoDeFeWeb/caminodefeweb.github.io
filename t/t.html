 <!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mendoza Transit</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      onerror="this.onerror=null;this.href='https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css'">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
:root{
  --primary:#2e7d32; --tram:#d32f2f; --blue:#1976d2; --amber:#f59e0b;
  --text:#1f2933; --muted:#64748b; --bg:#f8fafc; --surface:#fff;
  --border:#e2e8f0; --hover:#f1f5f9;
}
[data-theme="dark"]{
  --text:#e2e8f0; --muted:#94a3b8; --bg:#0f172a; --surface:#1e293b;
  --border:#334155; --hover:#334155;
}
*{ box-sizing:border-box; }
html,body{ height:100%; margin:0; }
body{
  font-family:system-ui,'Segoe UI',sans-serif;
  color:var(--text); background:var(--bg);
  overflow:hidden;
  transition:background .25s,color .25s;
}
#map{ position:absolute; inset:0; z-index:1; background:var(--bg); }

/* Topbar */
.topbar{
  position:absolute; top:0; left:0; right:0;
  padding:calc(10px + env(safe-area-inset-top)) 12px 10px;
  display:flex; align-items:center; gap:8px;
  background:var(--surface);
  border-bottom:1px solid var(--border);
  z-index:1100;
}
.topbar h1{
  margin:0; font-size:1rem; flex:1; min-width:0;
  display:flex; align-items:center; gap:8px;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
}
.topbar h1 i{ color:var(--primary); }
.icon-btn{
  width:38px; height:38px; display:grid; place-items:center;
  border:0; border-radius:10px; background:var(--hover); color:var(--text);
  font-size:1rem; cursor:pointer; flex:0 0 auto;
}
.icon-btn:hover{ background:var(--border); }
.icon-btn.is-loading i{ animation:spin 1s linear infinite; }
@keyframes spin{ to{ transform:rotate(360deg); } }

/* Filtros */
.filterbar{
  position:absolute; top:calc(64px + env(safe-area-inset-top));
  left:12px; display:flex; gap:8px; z-index:1050;
}
.chip{
  display:flex; align-items:center; gap:6px;
  padding:7px 11px; background:var(--surface);
  border:1.5px solid var(--border); border-radius:10px;
  color:var(--muted); font-size:.8rem; font-weight:600;
  cursor:pointer; user-select:none;
  box-shadow:0 2px 6px rgba(0,0,0,.1);
}
.chip input{ display:none; }
.chip__count{
  padding:1px 6px; border-radius:8px;
  background:rgba(0,0,0,.1); font-size:.7rem;
}
.chip--bike.is-on{ border-color:var(--primary); background:#e8f5e9; color:var(--primary); }
.chip--tram.is-on{ border-color:var(--tram); background:#ffebee; color:var(--tram); }
[data-theme="dark"] .chip--bike.is-on{ background:#1b3a1e; color:#a5d6a7; }
[data-theme="dark"] .chip--tram.is-on{ background:#4a1c1c; color:#ef9a9a; }

/* Estado */
.statusbar{
  position:absolute; bottom:calc(20px + env(safe-area-inset-bottom));
  left:12px; right:80px;
  padding:8px 12px; border-radius:10px;
  background:var(--surface); border:1px solid var(--border);
  font-size:.78rem; font-weight:600; color:var(--muted);
  box-shadow:0 2px 8px rgba(0,0,0,.1);
  z-index:1000;
  display:flex; align-items:center; gap:8px;
}
.statusbar.ok{ color:#1b5e20; background:#e8f5e9; border-color:#a5d6a7; }
.statusbar.warn{ color:#92400e; background:#fff8e1; border-color:#fcd34d; }
.statusbar.err{ color:#991b1b; background:#ffebee; border-color:#ef9a9a; }
[data-theme="dark"] .statusbar{ background:#1e293b; }
[data-theme="dark"] .statusbar.ok{ background:#1b3a1e; }
[data-theme="dark"] .statusbar.warn{ background:#3a2e0d; color:#fcd34d; }
[data-theme="dark"] .statusbar.err{ background:#3a1a1a; color:#ef9a9a; }

/* Botón ubicación */
.fab{
  position:absolute; right:16px;
  bottom:calc(20px + env(safe-area-inset-bottom));
  width:50px; height:50px; display:grid; place-items:center;
  border:0; border-radius:50%; background:var(--surface); color:var(--blue);
  font-size:1.1rem; box-shadow:0 4px 12px rgba(0,0,0,.2);
  cursor:pointer; z-index:1000;
}
.fab:active{ transform:scale(.9); }
.fab.is-locating i{ animation:spin 1s linear infinite; }

/* Marcadores */
.pin{
  width:30px; height:30px; display:grid; place-items:center;
  border:2.5px solid #fff; border-radius:50%;
  color:#fff; font-size:.85rem;
  box-shadow:0 3px 8px rgba(0,0,0,.3);
}
.pin--bike{ background:var(--primary); }
.pin--tram{ background:var(--tram); }

/* Popups */
.leaflet-popup-content-wrapper{
  border-radius:12px; padding:0; overflow:hidden;
  background:var(--surface); color:var(--text);
}
.leaflet-popup-content{ margin:0; }
.leaflet-popup-tip{ background:var(--surface); }
.popup-head{
  padding:10px 12px; color:#fff; font-size:.85rem; font-weight:700;
  display:flex; align-items:center; gap:8px;
}
.popup-head--bike{ background:var(--primary); }
.popup-head--tram{ background:var(--tram); }
.popup-body{ padding:8px 12px; font-size:.78rem; }
.popup-body .row{ display:flex; justify-content:space-between; gap:10px; padding:2px 0; }
.popup-body .k{ color:var(--muted); }
.popup-body .v{ font-weight:600; text-align:right; }
.popup-actions{ display:flex; gap:6px; padding:0 12px 12px; }
.popup-actions a{
  flex:1; padding:7px; border-radius:8px;
  background:var(--hover); color:var(--text);
  font-size:.74rem; font-weight:600; text-align:center;
  text-decoration:none;
}

/* Error overlay */
#fatal-error{
  position:fixed; inset:0; z-index:9999;
  background:#fee2e2; color:#991b1b;
  padding:24px; font-family:monospace; font-size:.85rem;
  overflow:auto; display:none; white-space:pre-wrap;
}
[data-theme="dark"] #fatal-error{ background:#3a1a1a; color:#fecaca; }
</style>
</head>
<body>

<header class="topbar">
  <h1><i class="fa-solid fa-map-location-dot"></i> Mendoza OpenData</h1>
  <button class="icon-btn" id="theme-btn" title="Modo oscuro"><i class="fa-solid fa-moon"></i></button>
  <button class="icon-btn" id="refresh-btn" title="Recargar"><i class="fa-solid fa-rotate"></i></button>
</header>

<div class="filterbar">
  <label class="chip chip--bike is-on">
    <input type="checkbox" data-type="bike" checked>
    <i class="fa-solid fa-bicycle"></i> Bicis
    <span class="chip__count" id="count-bike">0</span>
  </label>
  <label class="chip chip--tram is-on">
    <input type="checkbox" data-type="tram" checked>
    <i class="fa-solid fa-train-tram"></i> Tranvías
    <span class="chip__count" id="count-tram">0</span>
  </label>
</div>

<div class="statusbar" id="statusbar">
  <i class="fa-solid fa-circle-notch fa-spin"></i>
  <span id="status-text">Iniciando…</span>
</div>

<button class="fab" id="locate-btn" title="Mi ubicación">
  <i class="fa-solid fa-location-crosshairs"></i>
</button>

<div id="map"></div>
<div id="fatal-error"></div>

<!-- Leaflet con fallback de CDN -->
<script>
window.__leafletLoaded = false;
</script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        onload="window.__leafletLoaded=true"
        onerror="loadLeafletFallback()"></script>
<script>
function loadLeafletFallback(){
  var s = document.createElement('script');
  s.src = 'https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js';
  s.onload = function(){ window.__leafletLoaded = true; boot(); };
  s.onerror = function(){ showFatal('No se pudo cargar Leaflet desde ninguna CDN. Verificá tu conexión.'); };
  document.head.appendChild(s);
}
function showFatal(msg){
  var el = document.getElementById('fatal-error');
  el.style.display = 'block';
  el.textContent = '⚠️ Error crítico:\n\n' + msg;
}
window.addEventListener('error', function(e){
  console.error('Error global:', e.error || e.message);
});
</script>

<script>
/* ============================================================
   TODO EL CÓDIGO PRINCIPAL — envuelto para que NUNCA rompa
   ============================================================ */
function boot(){
  if (typeof L === 'undefined') {
    showFatal('Leaflet no está disponible.');
    return;
  }

  /* -------- Almacén seguro (nunca tira excepción) -------- */
  var store = (function(){
    var mem = {};
    var ok = false;
    try {
      window.localStorage.setItem('__t','1');
      window.localStorage.removeItem('__t');
      ok = true;
    } catch(e) { ok = false; }
    return {
      get: function(k, fb){
        try { return ok ? (window.localStorage.getItem(k) || fb) : (mem[k] || fb); }
        catch(e){ return mem[k] || fb; }
      },
      set: function(k, v){
        try { ok ? window.localStorage.setItem(k, v) : (mem[k] = v); }
        catch(e){ mem[k] = v; }
      }
    };
  })();

  /* -------- Configuración -------- */
  var CFG = {
    center: [-32.930, -68.820],
    zoom: 12,
    bbox: '-33.05,-68.95,-32.80,-68.70',
    timeoutMs: 12000,
    cacheKey: 'mendoza:v1',
    cacheTtl: 15 * 60 * 1000,
    themeKey: 'mendoza-theme:v1',
    endpoints: [
      'https://overpass-api.de/api/interpreter',
      'https://overpass.kumi.systems/api/interpreter',
      'https://overpass.private.coffee/api/interpreter'
    ]
  };

  /* -------- Datos semilla (siempre visibles) -------- */
  var SEED = [
    { id:'s/b1', type:'bike', lat:-32.8895, lon:-68.8458, name:'BiciMendoza - Parque Central',
      tags:{ operator:'BiciMendoza', capacity:'24' } },
    { id:'s/b2', type:'bike', lat:-32.8907, lon:-68.8395, name:'BiciMendoza - Peatonal Sarmiento',
      tags:{ operator:'BiciMendoza', capacity:'16' } },
    { id:'s/b3', type:'bike', lat:-32.8935, lon:-68.8555, name:'BiciMendoza - Parque San Martín',
      tags:{ operator:'BiciMendoza', capacity:'20' } },
    { id:'s/b4', type:'bike', lat:-32.8830, lon:-68.8360, name:'BiciMendoza - Ciudad Universitaria',
      tags:{ operator:'BiciMendoza', capacity:'18' } },
    { id:'s/b5', type:'bike', lat:-32.8985, lon:-68.8290, name:'BiciMendoza - Terminal de Ómnibus',
      tags:{ operator:'BiciMendoza', capacity:'22' } },
    { id:'s/b6', type:'bike', lat:-33.0022, lon:-68.7825, name:'BiciMendoza - Maipú Centro',
      tags:{ operator:'BiciMendoza', capacity:'14' } },
    { id:'s/b7', type:'bike', lat:-32.9130, lon:-68.8420, name:'BiciMendoza - Hospital Central',
      tags:{ operator:'BiciMendoza', capacity:'12' } },
    { id:'s/t1', type:'tram', lat:-32.8905, lon:-68.8540, name:'Metrotranvía - Estación Central',
      tags:{ operator:'Metrotranvía Mendoza' } },
    { id:'s/t2', type:'tram', lat:-32.8872, lon:-68.8470, name:'Metrotranvía - Pedro Molina',
      tags:{ operator:'Metrotranvía Mendoza' } },
    { id:'s/t3', type:'tram', lat:-32.8850, lon:-68.8390, name:'Metrotranvía - 9 de Julio',
      tags:{ operator:'Metrotranvía Mendoza' } },
    { id:'s/t4', type:'tram', lat:-32.8830, lon:-68.8310, name:'Metrotranvía - Pellegrini',
      tags:{ operator:'Metrotranvía Mendoza' } },
    { id:'s/t5', type:'tram', lat:-32.8805, lon:-68.8220, name:'Metrotranvía - San Martín',
      tags:{ operator:'Metrotranvía Mendoza' } },
    { id:'s/t6', type:'tram', lat:-32.9050, lon:-68.8010, name:'Metrotranvía - Godoy Cruz',
      tags:{ operator:'Metrotranvía Mendoza' } },
    { id:'s/t7', type:'tram', lat:-32.9180, lon:-68.7890, name:'Metrotranvía - Luzuriaga',
      tags:{ operator:'Metrotranvía Mendoza' } },
    { id:'s/t8', type:'tram', lat:-32.9310, lon:-68.7770, name:'Metrotranvía - Maipú',
      tags:{ operator:'Metrotranvía Mendoza' } },
    { id:'s/t9', type:'tram', lat:-32.9580, lon:-68.7580, name:'Metrotranvía - Gutiérrez',
      tags:{ operator:'Metrotranvía Mendoza' } },
    { id:'s/t10', type:'tram', lat:-32.9840, lon:-68.7350, name:'Metrotranvía - Rodeo del Medio',
      tags:{ operator:'Metrotranvía Mendoza' } }
  ];

  /* -------- Estado -------- */
  var state = {
    items: [],
    filters: { bike: true, tram: true },
    userLatLng: null,
    userMarker: null,
    userAccuracy: null,
    theme: store.get(CFG.themeKey, 'light'),
    loading: false
  };

  /* -------- DOM -------- */
  var $ = function(id){ return document.getElementById(id); };
  var statusBar = $('statusbar');
  var statusText = $('status-text');
  var refreshBtn = $('refresh-btn');
  var themeBtn = $('theme-btn');
  var locateBtn = $('locate-btn');
  var countBike = $('count-bike');
  var countTram = $('count-tram');

  var ESC = { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' };
  function esc(v){ return String(v == null ? '' : v).replace(/[&<>"']/g, function(c){ return ESC[c]; }); }

  function setStatus(kind, msg){
    statusBar.className = 'statusbar' + (kind ? ' ' + kind : '');
    var icons = { ok:'fa-circle-check', warn:'fa-triangle-exclamation', err:'fa-circle-exclamation' };
    var icon = icons[kind] || 'fa-circle-notch fa-spin';
    statusBar.innerHTML = '<i class="fa-solid ' + icon + '"></i><span>' + esc(msg) + '</span>';
  }

  /* -------- Mapa -------- */
  var map;
  try {
    map = L.map('map', { zoomControl: false, preferCanvas: true })
             .setView(CFG.center, CFG.zoom);
    L.control.zoom({ position: 'bottomleft' }).addTo(map);
  } catch(e) {
    showFatal('No se pudo inicializar el mapa:\n\n' + e.message);
    return;
  }

  var tileLayer = null;

  function applyTiles(){
    try {
      if (tileLayer) map.removeLayer(tileLayer);
      var url = state.theme === 'dark'
        ? 'https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png'
        : 'https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png';
      tileLayer = L.tileLayer(url, {
        maxZoom: 19,
        attribution: '&copy; OpenStreetMap &copy; CARTO'
      }).addTo(map);
      if (tileLayer.bringToBack) tileLayer.bringToBack();
    } catch(e) {
      console.warn('Error cargando tiles:', e.message);
    }
  }

  function applyTheme(){
    document.documentElement.setAttribute('data-theme', state.theme);
    themeBtn.querySelector('i').className = state.theme === 'dark' ? 'fa-solid fa-sun' : 'fa-solid fa-moon';
    applyTiles();
  }

  themeBtn.addEventListener('click', function(){
    state.theme = state.theme === 'dark' ? 'light' : 'dark';
    store.set(CFG.themeKey, state.theme);
    applyTheme();
  });

  /* -------- Iconos -------- */
  function pinIcon(type){
    return L.divIcon({
      html: '<div class="pin pin--' + type + '"><i class="fa-solid ' +
            (type === 'bike' ? 'fa-bicycle' : 'fa-train-tram') + '"></i></div>',
      className: '',
      iconSize: [30,30],
      iconAnchor: [15,15],
      popupAnchor: [0,-16]
    });
  }

  /* -------- Capas -------- */
  var layers = { bike: L.layerGroup(), tram: L.layerGroup() };

  /* -------- Popups -------- */
  function popupHtml(item){
    var t = item.tags || {};
    var isBike = item.type === 'bike';
    var rows = [];
    var addr = [t['addr:street'], t['addr:housenumber']].filter(Boolean).join(' ').trim();
    if (addr) rows.push(['Dirección', esc(addr)]);
    if (t.operator) rows.push(['Operador', esc(t.operator)]);
    if (t.network) rows.push(['Red', esc(t.network)]);
    if (t.capacity) rows.push(['Capacidad', esc(t.capacity) + (isBike ? ' bicis' : ' andenes')]);
    if (t.opening_hours) rows.push(['Horario', esc(t.opening_hours)]);
    if (state.userLatLng) {
      var d = map.distance([item.lat, item.lon], state.userLatLng);
      rows.push(['A tu ubicación', d < 1000 ? Math.round(d) + ' m' : (d/1000).toFixed(1) + ' km']);
    }
    var body = rows.map(function(r){
      return '<div class="row"><span class="k">' + r[0] + '</span><span class="v">' + r[1] + '</span></div>';
    }).join('');
    var dirUrl = 'https://www.google.com/maps/dir/?api=1&destination=' + item.lat + ',' + item.lon;
    return '<div class="popup">' +
      '<div class="popup-head popup-head--' + (isBike ? 'bike' : 'tram') + '">' +
        '<i class="fa-solid ' + (isBike ? 'fa-bicycle' : 'fa-train-tram') + '"></i>' +
        '<span>' + esc(item.name) + '</span>' +
      '</div>' +
      '<div class="popup-body">' + body + '</div>' +
      '<div class="popup-actions">' +
        '<a href="' + dirUrl + '" target="_blank" rel="noopener">' +
          '<i class="fa-solid fa-diamond-turn-right"></i> Cómo llegar' +
        '</a>' +
      '</div>' +
    '</div>';
  }

  /* -------- Render -------- */
  function render(items){
    state.items = items;
    try {
      layers.bike.clearLayers();
      layers.tram.clearLayers();
      var cb = 0, ct = 0;

      items.forEach(function(item){
        var marker = L.marker([item.lat, item.lon], {
          icon: pinIcon(item.type),
          title: item.name
        });
        marker.bindPopup(function(){ return popupHtml(item); }, { maxWidth: 300 });
        layers[item.type].addLayer(marker);
        if (item.type === 'bike') cb++; else ct++;
      });

      countBike.textContent = cb;
      countTram.textContent = ct;
      applyFilters();
    } catch(e) {
      console.error('Error en render:', e);
      setStatus('err', 'Error dibujando marcadores: ' + e.message);
    }
  }

  function applyFilters(){
    if (state.filters.bike) { if (!map.hasLayer(layers.bike)) map.addLayer(layers.bike); }
    else { if (map.hasLayer(layers.bike)) map.removeLayer(layers.bike); }
    if (state.filters.tram) { if (!map.hasLayer(layers.tram)) map.addLayer(layers.tram); }
    else { if (map.hasLayer(layers.tram)) map.removeLayer(layers.tram); }
  }

  /* -------- Overpass API -------- */
  function buildQuery(){
    return '[out:json][timeout:25];' +
      '(' +
      'nwr["amenity"="bicycle_rental"](' + CFG.bbox + ');' +
      'nwr["railway"="tram_stop"](' + CFG.bbox + ');' +
      ');' +
      'out center;';
  }

  function tryEndpoint(endpoint, query){
    return new Promise(function(resolve, reject){
      var ctrl = new AbortController();
      var timer = setTimeout(function(){ ctrl.abort(); }, CFG.timeoutMs);

      fetch(endpoint, {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded;charset=UTF-8' },
        body: 'data=' + encodeURIComponent(query),
        signal: ctrl.signal
      })
      .then(function(res){
        clearTimeout(timer);
        if (!res.ok) throw new Error('HTTP ' + res.status);
        return res.json();
      })
      .then(function(json){
        if (!json || !Array.isArray(json.elements)) throw new Error('JSON inválido');
        resolve(json.elements);
      })
      .catch(function(err){
        clearTimeout(timer);
        reject(err);
      });
    });
  }

  function fetchOverpass(query){
    var i = 0;
    function next(){
      if (i >= CFG.endpoints.length) return Promise.reject(new Error('Sin endpoints disponibles'));
      var ep = CFG.endpoints[i++];
      return tryEndpoint(ep, query).catch(function(err){
        console.warn('Falló', ep, err.message);
        return next();
      });
    }
    return next();
  }

  function normalize(elements){
    var items = [], seen = {};
    elements.forEach(function(el){
      var lat = typeof el.lat === 'number' ? el.lat : (el.center && el.center.lat);
      var lon = typeof el.lon === 'number' ? el.lon : (el.center && el.center.lon);
      if (typeof lat !== 'number' || typeof lon !== 'number') return;
      var tags = el.tags || {};
      var type = null;
      if (tags.amenity === 'bicycle_rental') type = 'bike';
      else if (tags.railway === 'tram_stop') type = 'tram';
      if (!type) return;
      var id = el.type + '/' + el.id;
      if (seen[id]) return;
      seen[id] = true;
      items.push({
        id: id, type: type, lat: lat, lon: lon, tags: tags,
        name: tags.name || (type === 'bike' ? 'Estación de bicicletas' : 'Parada de tranvía')
      });
    });
    return items;
  }

  /* -------- Carga -------- */
  function readCache(){
    try {
      var raw = store.get(CFG.cacheKey);
      if (!raw) return null;
      var p = JSON.parse(raw);
      if (!p || !Array.isArray(p.items)) return null;
      if (Date.now() - p.ts > CFG.cacheTtl) return null;
      return p;
    } catch(e){ return null; }
  }

  function writeCache(items){
    try { store.set(CFG.cacheKey, JSON.stringify({ ts: Date.now(), items: items })); }
    catch(e){}
  }

  function loadData(force){
    if (state.loading) return;
    state.loading = true;
    refreshBtn.classList.add('is-loading');
    refreshBtn.disabled = true;

    /* 1) Pintamos semilla al instante */
    if (state.items.length === 0) {
      render(SEED);
      setStatus('', 'Mostrando ' + SEED.length + ' puntos de ejemplo · consultando API…');
    }

    /* 2) Caché */
    if (!force) {
      var cached = readCache();
      if (cached) {
        render(cached.items);
        setStatus('', 'Datos guardados · actualizando…');
      }
    }

    /* 3) API real */
    fetchOverpass(buildQuery())
      .then(function(elements){
        var items = normalize(elements);
        if (items.length === 0) {
          setStatus('warn', 'La API no devolvió datos · mostrando ejemplo');
          return;
        }
        render(items);
        writeCache(items);
        var b = items.filter(function(i){ return i.type === 'bike'; }).length;
        var t = items.filter(function(i){ return i.type === 'tram'; }).length;
        setStatus('ok', 'Reales: ' + b + ' bicis · ' + t + ' tranvías');
      })
      .catch(function(err){
        console.warn('API falló:', err.message);
        setStatus('warn', 'API no accesible · mostrando ' + SEED.length + ' puntos de ejemplo');
      })
      .then(function(){
        state.loading = false;
        refreshBtn.classList.remove('is-loading');
        refreshBtn.disabled = false;
      });
  }

  /* -------- Geolocalización -------- */
  function locateUser(){
    if (!('geolocation' in navigator)) {
      setStatus('err', 'Geolocalización no soportada');
      return;
    }
    locateBtn.classList.add('is-locating');
    map.locate({ setView: true, maxZoom: 16, enableHighAccuracy: true, timeout: 12000 });
  }

  map.on('locationfound', function(e){
    locateBtn.classList.remove('is-locating');
    state.userLatLng = e.latlng;
    if (state.userMarker) {
      state.userMarker.setLatLng(e.latlng);
      state.userAccuracy.setLatLng(e.latlng).setRadius(e.accuracy);
    } else {
      state.userAccuracy = L.circle(e.latlng, {
        radius: e.accuracy, color: '#1976d2', weight: 1,
        fillColor: '#1976d2', fillOpacity: .12, interactive: false
      }).addTo(map);
      state.userMarker = L.circleMarker(e.latlng, {
        radius: 8, color: '#fff', weight: 3,
        fillColor: '#1976d2', fillOpacity: 1
      }).addTo(map).bindPopup('<b>Estás aquí</b>');
    }
    state.userMarker.openPopup();
    setStatus('ok', 'Ubicación detectada (±' + Math.round(e.accuracy) + ' m)');
  });

  map.on('locationerror', function(e){
    locateBtn.classList.remove('is-locating');
    setStatus('err', e.message || 'No se pudo obtener ubicación');
  });

  /* -------- Eventos UI -------- */
  refreshBtn.addEventListener('click', function(){ loadData(true); });
  locateBtn.addEventListener('click', locateUser);

  var chips = document.querySelectorAll('.chip input[data-type]');
  Array.prototype.forEach.call(chips, function(input){
    input.addEventListener('change', function(){
      var type = input.dataset.type;
      state.filters[type] = input.checked;
      input.closest('.chip').classList.toggle('is-on', input.checked);
      applyFilters();
    });
  });

  /* -------- Arranque -------- */
  try {
    applyTheme();
    loadData(false);
  } catch(e) {
    console.error('Error arrancando:', e);
    showFatal('Error al iniciar:\n\n' + e.message + '\n\n' + (e.stack || ''));
  }
}

/* Arranca cuando Leaflet esté listo */
if (window.__leafletLoaded) {
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', boot);
  } else {
    boot();
  }
} else {
  // Si Leaflet tarda, esperamos un poco
  var attempts = 0;
  var waitLeaflet = setInterval(function(){
    attempts++;
    if (window.__leafletLoaded) {
      clearInterval(waitLeaflet);
      boot();
    } else if (attempts > 50) {
      clearInterval(waitLeaflet);
      showFatal('Timeout esperando Leaflet. Verificá tu conexión a Internet.');
    }
  }, 100);
}
</script>
</body>
</html>
